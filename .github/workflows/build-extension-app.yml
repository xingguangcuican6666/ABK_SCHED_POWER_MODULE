name: Build Sched Power Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename release asset
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*release.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "release apk missing" >&2; exit 1; }
          mkdir -p dist
          cp -f "$apk" "dist/abk-sched-power-extension-release.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: sched-power-extension-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            dist/abk-sched-power-extension-release.apk

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "ABK sched power extension release"
          gh release upload "$tag" dist/abk-sched-power-extension-release.apk --clobber
